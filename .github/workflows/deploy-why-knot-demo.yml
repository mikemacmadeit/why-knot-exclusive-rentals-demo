name: Deploy Why Knot demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_SITE_ID repo variable is required"
            exit 1
          fi
          npx netlify-cli deploy --build --prod --message "why-knot demo ${GITHUB_SHA}"
          echo "Deployed site ${NETLIFY_SITE_ID}"
