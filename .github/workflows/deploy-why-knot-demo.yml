name: Deploy Why Knot demo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Resolve Netlify site id
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${{ vars.NETLIFY_SITE_ID }}" ]; then
            echo "site_id=${{ vars.NETLIFY_SITE_ID }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESP=$(curl -fsS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?filter=all&per_page=100")
          SITE_ID=$(node -e '
            const sites = JSON.parse(process.argv[1]);
            const hit = sites.find((s) =>
              (s.name || "").includes("why-knot") ||
              (s.ssl_url || s.url || "").includes("why-knot-exclusive-rentals")
            );
            if (!hit) {
              console.error("No Netlify site matched why-knot-exclusive-rentals");
              console.error(sites.map((s) => s.name + " " + (s.ssl_url || s.url)).join("\n"));
              process.exit(1);
            }
            process.stdout.write(hit.id);
          ' "$RESP")
          echo "Found site id $SITE_ID"
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: npx netlify-cli deploy --build --prod --message "why-knot demo ${{ github.sha }}"
